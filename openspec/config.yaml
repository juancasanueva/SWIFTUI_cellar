schema: spec-driven

project: cellar
artifact_store: hybrid
execution_mode: interactive
delivery_strategy: single-pr
review_budget_lines: 2000

context: |
  Cellar! — native macOS SwiftUI GUI for Homebrew (see PRD.md). Fresh Xcode template.
  Stack: Swift 6.3.3 toolchain / Xcode 26.6, SwiftUI + SwiftData, macOS 26.0 deployment target, arm64 only.
  Layout: app target `cellar` (thin SwiftUI shell) + local SPM package `Packages/CellarCore` (target `BrewProcess`).
  Targets today: cellar, cellarTests (Swift Testing), cellarUITests (XCUITest). Schemes: cellar, CellarCore.
  Architecture goal: protocol-first core in CellarCore, GUI-free testable; app shells out to `brew`.
  Concurrency: Swift 6 language mode (SWIFT_VERSION = 6.0) on every app-project build config, with
  approachable concurrency + MainActor default isolation on the app target; CellarCore uses SwiftPM's
  default `nonisolated` isolation and `.swiftLanguageMode(.v6)`.
  App sandbox is OFF (ENABLE_APP_SANDBOX = NO) — required to stat and spawn `/opt/homebrew/bin/brew`;
  hardened runtime stays ON.
  No git remote configured for pushes, no SwiftLint config, no formatter config.

testing:
  strict_tdd: true
  framework: Swift Testing (swift-testing) + XCUITest
  test_command: "xcodebuild test -project cellar.xcodeproj -scheme cellar -destination 'platform=macOS,arch=arm64'"
  fast_unit_command: "xcodebuild test -project cellar.xcodeproj -scheme cellar -destination 'platform=macOS,arch=arm64' -only-testing:cellarTests"
  core_package_command: "swift test --package-path Packages/CellarCore"
  build_command: "xcodebuild build -project cellar.xcodeproj -scheme cellar -destination 'platform=macOS,arch=arm64'"
  verified: true
  verified_on: "2026-08-01"
  layers:
    unit: swift-testing
    integration: swift-testing (real `brew` binary at /opt/homebrew/bin/brew, Homebrew 6.0.14)
    e2e: XCUITest (cellarUITests)
  coverage:
    available: true
    command: "xcodebuild test -project cellar.xcodeproj -scheme cellar -destination 'platform=macOS,arch=arm64' -enableCodeCoverage YES"
    threshold: 0
  quality:
    linter: "swiftlint (binary installed at /opt/homebrew/bin/swiftlint; no .swiftlint.yml in repo yet)"
    type_checker: "swiftc (compiler-enforced; no separate tool)"
    formatter: "none configured (swift-format not installed; xcbeautify available for log formatting)"

rules:
  proposal:
    - Anchor scope to a PRD.md milestone (M1..M6) and name it explicitly.
    - Include a rollback plan for anything touching the Xcode project file or target membership.
  specs:
    - Use Given/When/Then scenarios and RFC 2119 keywords (MUST, SHALL, SHOULD, MAY).
    - Specify observable behavior of CellarCore types without referencing SwiftUI views.
  design:
    - Keep all logic in Packages/CellarCore; the app target holds views, scenes, and DI wiring only.
    - Define protocol boundaries for every external dependency (Process, FileManager, network).
    - Document actor isolation and Sendable conformance for anything crossing a concurrency domain.
    - No `#available` branches — macOS 26 is the floor.
  tasks:
    - Group by phase with hierarchical numbering; each task completable in one session.
    - Sequence RED (failing test) before GREEN (implementation) for every behavioral task.
    - Forecast the 2,000-line review budget explicitly.
  apply:
    guidelines:
      - Strict TDD — write the failing test first, never implement ahead of a test.
      - Never manipulate the Cellar/Caskroom directly; always shell out to `brew`.
      - Prefer `swift test` in Packages/CellarCore for the inner loop; xcodebuild for the app target.
      - Follow existing Xcode template conventions until a spec supersedes them.
    tdd: true
    test_command: "swift test --package-path Packages/CellarCore"
    fallback_test_command: "xcodebuild test -project cellar.xcodeproj -scheme cellar -destination 'platform=macOS,arch=arm64' -only-testing:cellarTests"
  verify:
    test_command: "xcodebuild test -project cellar.xcodeproj -scheme cellar -destination 'platform=macOS,arch=arm64'"
    build_command: "xcodebuild build -project cellar.xcodeproj -scheme cellar -destination 'platform=macOS,arch=arm64'"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas.
    - Record which PRD milestone the archived change closed.
