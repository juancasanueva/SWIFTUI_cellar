name: Release

# The only publishing path for Cellar. A pushed version tag is the single
# trigger: this job holds a Developer ID certificate and an App Store Connect
# key, so any trigger reachable by a contributor would hand both to whoever
# reached it. `scripts/release.sh` carries the build sequence and runs the same
# way locally, but it can neither select a repository nor publish anything.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false        # never cancel a run mid-notarization

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 90
    # A job-level `permissions:` block **replaces** the workflow-level one
    # rather than extending it, so `contents: write` is restated here or
    # `gh release create` silently loses its token — a failure that would only
    # appear on a real tag, after Apple had already been asked for a
    # notarization round trip. `pages: write` authorizes the Pages deployment
    # and `id-token: write` is what mints the OIDC token that deployment must
    # present.
    permissions:
      contents: write
      pages: write
      id-token: write
    # GitHub requires Pages deployments to target this environment.
    environment: github-pages
    steps:
      - name: Refuse to publish from a private repository
        if: ${{ github.event.repository.private }}
        run: |
          echo "::error::Repository is private; release assets are not anonymously downloadable."
          exit 1

      - name: Check out the tagged commit
        uses: actions/checkout@v4

      - name: Pin Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Derive version from tag
        run: |
          set -euo pipefail
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Create ephemeral keychain and import the Developer ID certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail                       # never -e -u -x: tracing prints secrets
          KEYCHAIN="$RUNNER_TEMP/cellar-release.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/asc.p8"
          chmod 600 "$RUNNER_TEMP/asc.p8"
          security find-identity -v -p codesigning "$KEYCHAIN"   # identity names only

      # The three App Store Connect bindings are repeated verbatim per step
      # rather than shared through a YAML anchor (&asc / *asc): GitHub Actions
      # does not support anchors reliably across all workflow contexts, and a
      # silently dropped alias would strip the credentials from a step. Six
      # repeated lines are cheaper than that failure mode.
      - name: Archive
        env:                                  # ids are not secret material; the key is a path
          ASC_KEY_PATH: ${{ runner.temp }}/asc.p8
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: scripts/release.sh archive

      - name: Export and gate version and architecture
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/asc.p8
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: scripts/release.sh export

      - name: Package
        run: scripts/release.sh package

      - name: Notarize
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/asc.p8
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: scripts/release.sh notarize

      - name: Staple and repackage
        run: scripts/release.sh staple

      - name: Verify the extracted artifact
        run: scripts/release.sh verify

      - name: Record signing evidence
        run: codesign -dvvv --entitlements :- "build/export/cellar.app" 2>&1

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PRERELEASE=""
          case "$GITHUB_REF_NAME" in *-*) PRERELEASE="--prerelease" ;; esac
          # --verify-tag refuses a tag that does not already exist, so this step
          # is a consumer of the maintainer's tag and never an author of one.
          # Nothing here deletes, unpublishes, or re-flags a previous release:
          # withdrawing one stays a deliberate maintainer action.
          # shellcheck disable=SC2086            # $PRERELEASE is a bare flag or empty
          gh release create "$GITHUB_REF_NAME" "build/Home-Cellar-${VERSION}.zip" \
            --verify-tag --generate-notes --title "$GITHUB_REF_NAME" $PRERELEASE
      # --- extension point: the cask bump (m6-cask-tap) inserts here without
      #     restructuring the job. ---

      # Appcast publication. Every step below carries the same prerelease guard
      # the publish step uses for `--prerelease`: a Pages deploy is a full-site
      # replacement, so a prerelease reaching it with an empty artifact would
      # blank the live feed for every installed copy.
      #
      # They run **after** the release exists, because the item's enclosure
      # points at the published asset's download URL.
      - name: Build the appcast
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          # The key is bound here and read from the environment onto the signing
          # tool's standard input. It is never interpolated into a `run:` line,
          # which the runner would echo into the step header before masking it.
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          ASSET_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/Home-Cellar-${{ env.VERSION }}.zip
          ZIP_PATH: build/Home-Cellar-${{ env.VERSION }}.zip
          FEED_URL: https://juancasanueva.github.io/SWIFTUI_cellar/appcast.xml
          # Outside the checkout, so nothing enters the repository tree and
          # there is no new stowaway surface.
          OUTPUT_DIR: ${{ runner.temp }}/site
        run: scripts/appcast.sh

      - name: Configure Pages
        if: ${{ !contains(github.ref_name, '-') }}
        uses: actions/configure-pages@v6

      - name: Upload the site artifact
        id: site
        if: ${{ !contains(github.ref_name, '-') }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site

      # Deployed by calling the Pages REST API directly rather than through
      # `deploy-pages`, which sends the commit SHA as the build version and
      # exposes no input to change it. A build version Pages has already
      # deployed is not redeployed: the request is accepted, the deployment
      # reports `succeed`, and the previously published site keeps being
      # served. Two stable tags can point at one commit — `v0.0.2` and `v0.0.3`
      # both did — so that path silently leaves every installed copy reading a
      # feed that never learned about the newer release. The run number is what
      # makes the version unique; the commit alone is not.
      - name: Deploy to Pages
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          # `github.token` rather than a repository secret: the job already
          # holds `pages: write`, and nothing here needs a wider credential.
          RELEASE_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.site.outputs.artifact_id }}
          BUILD_VERSION: ${{ github.sha }}-${{ github.run_number }}
        run: |
          set -euo pipefail                       # never -e -u -x: tracing prints the OIDC token
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/deployments"
          ACCEPT="Accept: application/vnd.github+json"
          VERSION_HEADER="X-GitHub-Api-Version: 2022-11-28"

          # The OIDC token is what proves to Pages that the deployment came
          # from this run. It is a credential: it is never echoed, and it
          # reaches the request body through `jq --arg` rather than through
          # string interpolation.
          OIDC_TOKEN="$(curl -sSf \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}" | jq -r '.value')"

          # `--argjson` for the artifact id, which the API types as a number,
          # and which therefore also fails loudly if the upload produced none.
          BODY="$(jq -n \
            --argjson artifact_id "${ARTIFACT_ID}" \
            --arg pages_build_version "${BUILD_VERSION}" \
            --arg oidc_token "${OIDC_TOKEN}" \
            '{artifact_id: $artifact_id,
              pages_build_version: $pages_build_version,
              oidc_token: $oidc_token}')"

          # Piped on standard input, not passed as an argument: the token would
          # otherwise be readable in the process list for the life of the call.
          DEPLOYMENT_ID="$(printf '%s' "$BODY" | curl -sSf -X POST "$API" \
            -H "Authorization: Bearer ${RELEASE_TOKEN}" \
            -H "$ACCEPT" -H "$VERSION_HEADER" \
            --data-binary @- | jq -r '.id')"
          echo "Pages deployment ${DEPLOYMENT_ID} requested as build version ${BUILD_VERSION}."

          # A created deployment is not a published one. Ten minutes is the
          # same ceiling `deploy-pages` used.
          DEADLINE=$(( SECONDS + 600 ))
          STATUS="unknown"
          while [ "$SECONDS" -lt "$DEADLINE" ]; do
            STATUS="$(curl -sSf "${API}/${DEPLOYMENT_ID}" \
              -H "Authorization: Bearer ${RELEASE_TOKEN}" \
              -H "$ACCEPT" -H "$VERSION_HEADER" | jq -r '.status')"
            case "$STATUS" in
              succeed)
                echo "Pages deployment ${DEPLOYMENT_ID} reported: ${STATUS}."
                exit 0
                ;;
              deployment_failed|deployment_content_failed|deployment_attempt_error|deployment_lost|deployment_cancelled)
                break
                ;;
            esac
            sleep 5
          done

          echo "::error::Pages deployment ${DEPLOYMENT_ID} ended in status: ${STATUS}"
          # Best effort: a deployment left running would hold the Pages
          # environment against the next tag.
          curl -sS -X POST "${API}/${DEPLOYMENT_ID}/cancel" \
            -H "Authorization: Bearer ${RELEASE_TOKEN}" \
            -H "$ACCEPT" -H "$VERSION_HEADER" > /dev/null || true
          exit 1

      - name: Delete the ephemeral keychain and the API key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/cellar-release.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/asc.p8" "$RUNNER_TEMP/cert.p12"
